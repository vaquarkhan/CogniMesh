# CogniMesh full-stack local development
# Usage: docker compose up --build
# Portal: http://localhost:3000  API: http://localhost:4000  Catalog: http://localhost:8080

services:
  catalog:
    image: ghcr.io/vaquarkhan/cognimesh-catalog:1.0.0
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: cognimesh-catalog
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/products"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    image: ghcr.io/vaquarkhan/cognimesh-api:1.0.0
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "4000:4000"
    environment:
      # Local compose is an insecure demo stack: auth guard requires non-production NODE_ENV.
      NODE_ENV: development
      AUTH_DISABLED: "true"
      PORT: "4000"
      CATALOG_URL: http://catalog:8080
      CATALOG_FALLBACK: embedded
      CORS_ORIGINS: http://localhost:3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
    depends_on:
      catalog:
        condition: service_healthy

  portal:
    image: ghcr.io/vaquarkhan/cognimesh-portal:1.0.0
    build:
      context: .
      dockerfile: docker/portal.Dockerfile
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
